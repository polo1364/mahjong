// 檢查並設定天聽/地聽狀態。當玩家宣告聽牌時調用。
// 天聽：莊家摸完第一張牌打出後即處於聽牌，且無其他明吃碰槓；地聽：起牌後海底打進8張牌內且四家皆未吃碰，宣告聽牌。
function updateTianDiTing(pid) {
  const pl = S.players[pid];
  // 已有開明牌則不計天聽/地聽
  if (S.anyOpenMeld) return;
  // 天聽僅適用於莊家第一輪摸打結束後即聽牌
  if (pid === S.dealer && S.drawCount === 1) {
    pl.tianTing = true;
    return;
  }
  // 地聽：前8次摸牌內
  if (S.drawCount <= 8) {
    pl.diTing = true;
  }
}

/* ========= 胡牌判定 ========= */
/**
 * 檢查是否可以胡牌
 * 台灣16張麻將胡牌條件：5組面子（順子或刻子）+ 1組對子（將牌）= 17張牌
 * 或者特殊牌型如七對子
 */
function isWinningNow(hand, melds, winTile) {
  const tiles = hand.slice().sort((a, b) => tileSortKey(a) - tileSortKey(b));
  
  // 計算槓子數量（每個槓子算1組面子但有4張牌）
  const kongCount = melds.filter(m => m.type === 'kong').length;
  const meldSetCount = melds.length;  // 每個副露算1組面子
  
  // 七對子檢查：必須沒有副露，且手牌16張
  if (melds.length === 0 && tiles.length === 16 && isSevenPairs(tiles)) {
    return true;
  }
  
  // 標準胡牌：需要 5 組面子 + 1 對將牌
  // 手牌需要完成的組數 = 5 - 副露數
  const neededSets = Math.max(0, 5 - meldSetCount);
  
  // 手牌張數檢查（考慮槓子）
  // 正常: 17 - 副露數*3 = 手牌數（不含槓額外的牌）
  // 有槓時: 17 - (副露數-槓數)*3 - 槓數*4 + 槓數 = 手牌數
  // 簡化: 手牌應為 17 - 副露數*3 + 槓數 張
  const expectedHandSize = 17 - meldSetCount * 3 + kongCount;
  
  // 允許一定的容差（因為可能在不同階段調用）
  if (tiles.length < neededSets * 3 + 2) {
    return false;  // 手牌不足以形成所需組數
  }
  
  return canStandardWin(tiles, neededSets);
}

// 檢查是否聽牌（只差一張牌就能胡）
function isListening(hand, melds) {
  // 檢查是否只差一張牌就能胡
  // 遍歷所有可能的牌，看是否能胡
  const allPossibleTiles = [];
  for (let suit of [SUIT_W, SUIT_T, SUIT_B]) {
    for (let rank = 1; rank <= 9; rank++) {
      allPossibleTiles.push({ suit, rank, id: -1 });
    }
  }
  WINDS.forEach(name => allPossibleTiles.push({ suit: SUIT_F, name, id: -1 }));
  DRAGONS.forEach(name => allPossibleTiles.push({ suit: SUIT_D, name, id: -1 }));
  
  return allPossibleTiles.some(tile => {
    const testHand = hand.concat([tile]);
    return isWinningNow(testHand, melds, tile);
  });
}

// 計算聽牌時可以胡哪些牌
// 給定目前手牌與副露，回傳一個牌Key陣列，表示哪些牌能讓手牌胡牌
function calcWaitingTiles(hand, melds) {
  const waits = [];
  // 建立所有可能的牌樣（1-9索筒萬、東南西北、紅中發白）
  const allPossibleTiles = [];
  for (let suit of [SUIT_W, SUIT_T, SUIT_B]) {
    for (let rank = 1; rank <= 9; rank++) {
      allPossibleTiles.push({ suit, rank, id: -1 });
    }
  }
  WINDS.forEach(name => allPossibleTiles.push({ suit: SUIT_F, name, id: -1 }));
  DRAGONS.forEach(name => allPossibleTiles.push({ suit: SUIT_D, name, id: -1 }));
  const seen = new Set();
  allPossibleTiles.forEach(tile => {
    // 測試手牌加上此牌是否能胡牌
    const testHand = hand.concat([tile]);
    if (isWinningNow(testHand, melds, tile)) {
      const k = tileKey(tile);
      if (!seen.has(k)) {
        waits.push(k);
        seen.add(k);
      }
    }
  });
  // 依照牌排序函式排序
  waits.sort((a, b) => {
    // 解析牌 key 為牌物件，以便使用 tileSortKey 進行排序
    const parseKey = (k) => {
      const s = k[0];
      const v = k.slice(1);
      if (s === SUIT_W || s === SUIT_T || s === SUIT_B) {
        return { suit: s, rank: parseInt(v), id: -1 };
      }
      if (s === SUIT_F || s === SUIT_D) {
        return { suit: s, name: v, id: -1 };
      }
      return { suit: s, id: -1 };
    };
    const ta = parseKey(a);
    const tb = parseKey(b);
    return tileSortKey(ta) - tileSortKey(tb);
  });
  return waits;
}

function isSevenPairs(tiles) {
  if (tiles.length !== 16) return false;
  const m = countByKey(tiles);
  const vals = Object.values(m);
  return vals.filter(x => x === 2).length === 8 && vals.every(x => x === 2 || x === 0);
}

function canStandardWin(tiles, need = 5) {
  const counts = countByKey(tiles);
  for (const k in counts) {
    if (counts[k] >= 2) {
      counts[k] -= 2;
      if (canSplitMelds(counts, need)) return true;
      counts[k] += 2;
    }
  }
  return false;
}

function canSplitMelds(counts, need) {
  if (need === 0) return Object.values(counts).every(v => v === 0);
  let first = null;
  for (const k in counts) {
    if (counts[k] > 0) {
      first = k;
      break;
    }
  }
  if (!first) return need === 0;
  
  if (counts[first] >= 3) {
    counts[first] -= 3;
    if (canSplitMelds(counts, need - 1)) return true;
    counts[first] += 3;
  }
  
  const s = first[0];
  const v = parseInt(first.slice(1));
  if ((s === SUIT_W || s === SUIT_T || s === SUIT_B) && v <= 7) {
    const k2 = s + (v + 1), k3 = s + (v + 2);
    if ((counts[k2] || 0) > 0 && (counts[k3] || 0) > 0) {
      counts[first]--;
      counts[k2]--;
      counts[k3]--;
      if (canSplitMelds(counts, need - 1)) return true;
      counts[first]++;
      counts[k2]++;
      counts[k3]++;
    }
  }
  return false;
}

function countByKey(tiles) {
  const m = {};
  for (const t of tiles) {
    const k = tileKey(t);
    m[k] = (m[k] || 0) + 1;
  }
  return m;
}

function tileSortKey(t) {
  const order = { W: 0, T: 1, B: 2, F: 3, D: 4, H: 5 };
  const o = order[t.suit];
  const v = (t.suit === SUIT_W || t.suit === SUIT_T || t.suit === SUIT_B) ? t.rank : ({ E: 1, S: 2, W: 3, N: 4, C: 5, F: 6, B: 7 }[t.name] || 0);
  return o * 100 + v;
}

/* ========= AI 邏輯 ========= */

/**
 * 計算向聽數（離胡牌還差幾張牌）
 * 優化版本，更準確的計算
 */
function calcShanten(hand, melds = []) {
  const tiles = hand.slice();
  const meldCount = melds.length;
  const neededSets = 5 - meldCount;
  
  // 檢查是否已胡牌
  if (isWinningNow(tiles.concat([{ suit: 'W', rank: 1, id: -1 }]), melds, { suit: 'W', rank: 1, id: -1 })) {
    return 0;  // 聽牌
  }
  
  // 計算標準型向聽數
  const counts = countByKey(tiles);
  let sets = 0;
  let pairs = 0;
  let taatsu = 0;  // 搭子（兩張牌差一張成順子或刻子）
  let isolated = 0;
  
  const processed = new Set();
  
  for (const k in counts) {
    if (processed.has(k)) continue;
    const c = counts[k];
    
    if (c >= 3) {
      sets++;
      counts[k] -= 3;
    }
    if (counts[k] >= 2) {
      if (pairs === 0) {
        pairs = 1;
        counts[k] -= 2;
      } else {
        taatsu++;
        counts[k] -= 2;
      }
    }
    
    // 檢查順子搭子
    const s = k[0];
    const v = parseInt(k.slice(1));
    if ((s === 'W' || s === 'T' || s === 'B') && counts[k] >= 1) {
      const k1 = s + (v + 1);
      const k2 = s + (v + 2);
      
      if ((counts[k1] || 0) >= 1 && (counts[k2] || 0) >= 1) {
        sets++;
        counts[k]--;
        counts[k1]--;
        counts[k2]--;
      } else if ((counts[k1] || 0) >= 1) {
        taatsu++;
        counts[k]--;
        counts[k1]--;
      } else if ((counts[k2] || 0) >= 1) {
        taatsu++;
        counts[k]--;
        counts[k2]--;
      }
    }
    
    if (counts[k] === 1) {
      isolated++;
    }
    
    processed.add(k);
  }
  
  // 標準型向聽數計算
  const standardShanten = Math.max(0, (neededSets - sets) * 2 - taatsu - pairs);
  
  // 七對子向聽數
  const pairCounts = countByKey(tiles);
  let pairCount = 0;
  for (const k in pairCounts) {
    pairCount += Math.floor(pairCounts[k] / 2);
  }
  const sevenPairsShanten = meldCount === 0 ? Math.max(0, 8 - pairCount) : 99;
  
  return Math.min(standardShanten, sevenPairsShanten);
}

function shantenAfterRemove(hand) {
  function approxShanten14(tiles) {
    if (isWinningNow(tiles, [], null)) return 0;
    const m = countByKey(tiles);
    let pairs = 0, triples = 0, taatsu = 0, singles = 0;
    
    // 先計算刻子和對子
    for (const k in m) {
      const c = m[k];
      if (c >= 3) {
        triples++;
        m[k] -= 3;
      }
      if (m[k] >= 2) {
        pairs++;
        m[k] -= 2;
      }
    }
    
    // 計算搭子（相鄰或間隔的牌）
    const keys = Object.keys(m).sort();
    for (const k of keys) {
      if (m[k] < 1) continue;
      const s = k[0];
      const v = parseInt(k.slice(1));
      
      if (s === 'W' || s === 'T' || s === 'B') {
        // 檢查順子搭子
        const k1 = s + (v + 1);
        const k2 = s + (v + 2);
        if ((m[k1] || 0) >= 1) {
          taatsu++;
          m[k]--;
          m[k1]--;
        } else if ((m[k2] || 0) >= 1) {
          taatsu++;
          m[k]--;
          m[k2]--;
        }
      }
    }
    
    // 剩餘的單張
    for (const k in m) {
      singles += m[k];
    }
    
    // 估計向聽數
    let est = Math.max(0, 5 - (triples + Math.floor((pairs + taatsu) / 2)));
    return est;
  }
  
  let best = 99;
  const n = hand.length;
  for (let i = 0; i < n; i++) {
    const take = hand.filter((_, k) => k !== i);
    best = Math.min(best, approxShanten14(take));
  }
  
  // 七對子向聽數
  const m = countByKey(hand);
  let pairCount = 0;
  for (const k in m) {
    pairCount += Math.floor(m[k] / 2);
  }
  const sevenNeed = Math.max(0, 8 - pairCount);
  
  return Math.min(best, sevenNeed);
}

/**
 * AI 選擇丟棄的牌 - 優化版本
 * 考慮更多因素：向聽數、危險度、牌效率、防守
 */
function aiChooseDiscard(pid) {
  const me = S.players[pid];
  
  // 收集所有可見的牌（棄牌區、副露）
  const visible = [];
  S.players.forEach(p => {
    visible.push(...p.discards);
    p.melds.forEach(m => visible.push(...m.tiles));
  });
  
  // 檢查其他玩家是否已聽牌
  const listeningPlayers = [];
  for (let i = 0; i < 4; i++) {
    if (i !== pid && S.players[i].declaredListen) {
      listeningPlayers.push(i);
    }
  }
  
  // 判斷是否需要防守模式
  const needDefense = listeningPlayers.length > 0;
  const myShanten = shantenAfterRemove(me.hand);
  const isNearWin = myShanten <= 2;
  
  // 評估每張牌的得分
  let cands = me.hand.map(t => {
    const after = me.hand.filter(x => x !== t);
    const sh = shantenAfterRemove(after);
    let score = 0;
    
    // === 1. 向聽數變化 ===
    // 向聽數減少越多越好
    const shantenDiff = sh - myShanten;
    score -= shantenDiff * 100;  // 向聽數增加會大幅扣分
    
    // === 2. 聽牌評估 ===
    let waitCount = 0;
    let maxWaitTiles = 0;
    
    if (isListening(after, me.melds)) {
      const waits = calcWaitingTiles(after, me.melds);
      waitCount = waits.length;
      
      // 計算每種等牌的剩餘張數
      waits.forEach(wk => {
        const total = 4;
        const used = visible.filter(vt => tileKey(vt) === wk).length;
        const handUsed = me.hand.filter(ht => tileKey(ht) === wk).length;
        const remain = Math.max(0, total - used - handUsed);
        maxWaitTiles += remain;
      });
      
      score += waitCount * 200;     // 聽牌種類多加分
      score += maxWaitTiles * 30;   // 剩餘張數多加分
    }
    
    // === 3. 危險度評估 ===
    const tileK = tileKey(t);
    let dangerLevel = 0;
    
    // 檢查是否會直接放炮
    if (needDefense) {
      listeningPlayers.forEach(lp => {
        // 檢查是否在對方的等牌中
        const oppWaits = S.players[lp].waitKeys || [];
        if (oppWaits.includes(tileK)) {
          dangerLevel += 2000;  // 確定放炮
        } else if (canWinOn(lp, t)) {
          dangerLevel += 1500;  // 可能放炮
        }
      });
    }
    
    // 安全牌評估
    let safetyScore = 0;
    
    // 檢查是否是現張（別人打過的牌）
    const sameDiscarded = visible.filter(vt => tileKey(vt) === tileK).length;
    if (sameDiscarded > 0) {
      safetyScore += sameDiscarded * 50;  // 現張較安全
    }
    
    // 檢查是否是生張（完全沒出現過的牌）
    const isRaw = sameDiscarded === 0 && !me.discards.some(d => tileKey(d) === tileK);
    if (isRaw && needDefense) {
      dangerLevel += 100;  // 生張有風險
    }
    
    // 字牌和么九牌相對安全
    if (t.suit === SUIT_F || t.suit === SUIT_D) {
      safetyScore += 30;
    } else if (t.rank === 1 || t.rank === 9) {
      safetyScore += 20;
    }
    
    // === 4. 牌效率評估 ===
    const structureScore = evaluateHandStructure(after, me.melds);
    
    // === 5. 綜合評分 ===
    if (needDefense && !isNearWin) {
      // 防守模式：安全優先
      score = safetyScore * 3 - dangerLevel + structureScore * 0.5;
    } else if (isNearWin) {
      // 進攻模式：聽牌優先，但也考慮安全
      score = score + structureScore - dangerLevel * 0.3 + safetyScore * 0.5;
    } else {
      // 平衡模式
      score = score + structureScore - dangerLevel * 0.5 + safetyScore;
    }
    
    return { tile: t, score, dangerLevel };
  });
  
  // 排序並選擇最佳的牌
  cands.sort((a, b) => b.score - a.score);
  
  // 如果最高分的牌危險度極高，考慮次選
  if (cands[0].dangerLevel >= 1500 && cands.length > 1) {
    const safeCands = cands.filter(c => c.dangerLevel < 1000);
    if (safeCands.length > 0) {
      return safeCands[0].tile;
    }
  }
  
  return cands[0].tile;
}

/**
 * 評估手牌結構
 * 返回結構評分（越高越好）
 */
function evaluateHandStructure(hand, melds) {
  const counts = countByKey(hand);
  let score = 0;
  
  let pairs = 0, triples = 0, taatsu = 0, isolated = 0;
  const processed = new Set();
  
  for (const k in counts) {
    const c = counts[k];
    
    // 刻子最有價值
    if (c >= 3) {
      score += 60;
      triples++;
    }
    // 對子次之
    else if (c === 2) {
      score += 25;
      pairs++;
    }
    // 單張需要評估連接
    else if (c === 1) {
      const tile = keyToTile(k);
      if (tile.suit === 'W' || tile.suit === 'T' || tile.suit === 'B') {
        const rank = tile.rank;
        const hasAdjacent = counts[`${tile.suit}${rank-1}`] || counts[`${tile.suit}${rank+1}`];
        const hasSkip = counts[`${tile.suit}${rank-2}`] || counts[`${tile.suit}${rank+2}`];
        
        if (hasAdjacent) {
          score += 15;  // 有相鄰牌
          taatsu++;
        } else if (hasSkip) {
          score += 8;   // 有間隔牌
        } else {
          score -= 10;  // 孤張
          isolated++;
        }
        
        // 中張牌價值較高
        if (rank >= 3 && rank <= 7) {
          score += 5;
        }
      } else {
        // 字牌單張
        if (!processed.has(k)) {
          score -= 5;
          isolated++;
        }
      }
    }
    processed.add(k);
  }
  
  // 副露加成
  score += melds.length * 30;
  
  return score;
}

/**
 * 計算打出某張牌的危險度
 */
function riskOf(tile) {
  // 字牌相對安全
  if (tile.suit === SUIT_F || tile.suit === SUIT_D) return 0.3;
  // 么九牌較安全
  if (tile.rank === 1 || tile.rank === 9) return 0.5;
  // 28牌中等
  if (tile.rank === 2 || tile.rank === 8) return 0.7;
  // 中張牌最危險
  return 1.0;
}

function keyToTile(k) {
  const s = k[0], v = k.slice(1);
  if (s === 'W' || s === 'T' || s === 'B') return { suit: s, rank: parseInt(v), id: -1 };
  if (s === 'F') return { suit: SUIT_F, name: v, id: -1 };
  if (s === 'D') return { suit: SUIT_D, name: v, id: -1 };
  return { suit: '?', id: -1 };
}

/* ========= 吃牌、碰牌與槓牌邏輯 ========= */

/**
 * 吃牌檢查
 * 規則：只能吃上家（逆時針方向的前一家）的牌，且只能吃數字牌（萬筒條）
 * 
 * 座位順序（逆時針）：東→南→西→北
 * 畫面位置逆時針順序：0(下/玩家) → 3(右) → 1(上) → 2(左) → 0...
 * 
 * 所以：
 * - 玩家0的上家是2（左邊）
 * - 玩家3的上家是0（下邊）
 * - 玩家1的上家是3（右邊）
 * - 玩家2的上家是1（上邊）
 */
function canChow(pid, tile) {
  const pl = S.players[pid];

  // 最多允許5組副露（16張麻將需要 5 組面子＋1 對將牌）
  if (pl.melds.length >= 5) return [];
  
  // 逆時針順序（出牌順序）：0 → 3 → 1 → 2 → 0...
  // 只有「下家」可以吃「上家」的牌
  // 如果當前出牌者是 S.lastDiscard.from，那只有下家可以吃
  const discardFrom = S.lastDiscard ? S.lastDiscard.from : S.turn;
  const counterClockwiseOrder = [0, 3, 1, 2];
  const fromIndex = counterClockwiseOrder.indexOf(discardFrom);
  const nextPlayer = counterClockwiseOrder[(fromIndex + 1) % 4];
  
  // 只有下家可以吃
  if (pid !== nextPlayer) return [];
  
  // 已報聽不能吃
  if (pl.declaredListen) return [];
  
  // 只能吃數字牌
  if (tile.suit !== SUIT_W && tile.suit !== SUIT_T && tile.suit !== SUIT_B) return [];
  
  const rank = tile.rank;
  const suit = tile.suit;
  const patterns = [];
  
  // 檢查三種吃牌型態
  // 1. 左吃（吃的牌是最小的）：需要手牌有 rank+1 和 rank+2
  if (rank <= 7) {
    const has1 = pl.hand.some(t => t.suit === suit && t.rank === rank + 1);
    const has2 = pl.hand.some(t => t.suit === suit && t.rank === rank + 2);
    if (has1 && has2) patterns.push([rank, rank + 1, rank + 2]);
  }
  
  // 2. 中吃（吃的牌在中間）：需要手牌有 rank-1 和 rank+1
  if (rank >= 2 && rank <= 8) {
    const has1 = pl.hand.some(t => t.suit === suit && t.rank === rank - 1);
    const has2 = pl.hand.some(t => t.suit === suit && t.rank === rank + 1);
    if (has1 && has2) patterns.push([rank - 1, rank, rank + 1]);
  }
  
  // 3. 右吃（吃的牌是最大的）：需要手牌有 rank-2 和 rank-1
  if (rank >= 3) {
    const has1 = pl.hand.some(t => t.suit === suit && t.rank === rank - 2);
    const has2 = pl.hand.some(t => t.suit === suit && t.rank === rank - 1);
    if (has1 && has2) patterns.push([rank - 2, rank - 1, rank]);
  }
  
  return patterns;
}

function doChow(pid, tile, pattern) {
  const pl = S.players[pid];
  const suit = tile.suit;
  const tiles = [tile];
  
  // 從手牌中移除對應的牌
  pattern.forEach(rank => {
    if (rank !== tile.rank) {
      const idx = pl.hand.findIndex(t => t.suit === suit && t.rank === rank);
      if (idx >= 0) {
        tiles.push(pl.hand.splice(idx, 1)[0]);
      }
    }
  });
  
  // 排序牌組
  tiles.sort((a, b) => a.rank - b.rank);
  
  // 紀錄吃的中心牌索引：吃的牌在排序後的位置
  const centerIdx = tiles.findIndex(t => t === tile);
  pl.melds.push({ type: 'chow', tiles, centerIdx });
  // 吃牌屬於明牌
  S.anyOpenMeld = true;
  log(`🍜 ${playerName(pid)} 吃了 ${tiles.map(t => keyToText(tileKey(t))).join(' ')}`);
  // 吃牌特效與音效（所有玩家）
  showEffect('🍜 吃', '#8BC34A');
  playSound(500, 0.2, 'triangle');
  
  // 從棄牌區移除被吃的牌
  if (S.lastDiscard && S.lastDiscard.from !== undefined) {
    removeDiscardFromArea(S.lastDiscard.from);
  }
  
  S.turn = pid;
  S.lastDiscard = null;
  S.waitReact = null;
  hideReactionPanel();
  renderAll();

  // 如果是玩家吃牌，檢查是否可報聽（吃牌後總牌數為17 + 槓數）
  if (pid === 0) {
    const me = S.players[0];
    if (!me.declaredListen) {
      const kongCount = countKongs(me);
      const totalTiles = me.hand.length + me.melds.reduce((sum, m) => sum + m.tiles.length, 0);
      const expectedFull = 17 + kongCount;
      if (totalTiles === expectedFull) {
        const canListenNow = me.hand.some(tile2 => {
          const testHand = me.hand.filter(t => t !== tile2);
          return isListening(testHand, me.melds);
        });
        // 不在吃牌後立即彈出報聽面板；於丟牌完成後另行提示
      }
    }
  }

  // 更新最後動作與執行者：吃牌後下一步應出牌，不再摸牌
  S.lastAction = 'chow';
  S.lastActor = pid;
}

/**
 * 碰牌檢查
 * 規則：手牌中有兩張相同的牌時可以碰
 * 注意：已報聽後不能碰
 */
function canPong(pid, tile) {
  const pl = S.players[pid];

  // 若已經有5組副露，則不允許再碰
  if (pl.melds.length >= 5) return false;
  
  // 已報聽不能碰
  if (pl.declaredListen) return false;
  
  const k = tileKey(tile);
  const cnt = pl.hand.filter(t => tileKey(t) === k).length;
  return cnt >= 2;
}

/**
 * 明槓檢查（別人打出的牌）
 * 規則：手牌中有三張相同的牌時可以槓
 * 注意：已報聽後不能明槓
 */
function canKong(pid, tile) {
  const pl = S.players[pid];
  
  // 不允許同一家擁有超過三個槓
  if (countKongs(pl) >= 3) return false;

  // 若已有5組副露，則不可再槓（新槓會增加一副露）
  if (pl.melds.length >= 5) return false;
  
  // 已報聽不能明槓
  if (pl.declaredListen) return false;
  
  const k = tileKey(tile);
  const cnt = pl.hand.filter(t => tileKey(t) === k).length;
  return cnt >= 3;
}

/**
 * 暗槓檢查
 * 規則：手牌中有四張相同牌時可以暗槓
 * 注意：報聽後仍可暗槓，但必須不改變聽牌（即暗槓的牌不在等牌中）
 */
function canConcealedKong(pid) {
  const pl = S.players[pid];
  
  // 當前槓數已達上限3組時，不允許再暗槓
  if (countKongs(pl) >= 3) return [];

  // 若已有5組副露，則不允許再暗槓（新暗槓會增加一副露）
  if (pl.melds.length >= 5) return [];
  
  // 不允許在剩餘牌數過少時暗槓
  if ((S.wall.length + S.deadWall.length) <= 3) return [];
  
  const counts = countByKey(pl.hand);
  let possibleKongs = Object.keys(counts).filter(k => counts[k] >= 4);
  
  // 如果已報聽，需要檢查暗槓後是否仍能保持相同的聽牌
  if (pl.declaredListen && pl.waitKeys && pl.waitKeys.length > 0) {
    possibleKongs = possibleKongs.filter(kongKey => {
      // 暗槓後的手牌
      const afterKong = pl.hand.filter(t => tileKey(t) !== kongKey);
      
      // 檢查暗槓後是否仍聽相同的牌
      if (!isListening(afterKong, pl.melds.concat([{ type: 'kong', tiles: [], concealed: true }]))) {
        return false;
      }
      
      // 檢查等牌是否相同
      const newWaits = calcWaitingTiles(afterKong, pl.melds);
      const oldWaits = pl.waitKeys;
      
      // 等牌必須完全相同
      if (newWaits.length !== oldWaits.length) return false;
      return newWaits.every(w => oldWaits.includes(w));
    });
  }
  
  return possibleKongs;
}

/**
 * 加槓檢查
 * 規則：已碰的牌中若手牌裡還有第4張可以加槓
 * 注意：報聽後仍可加槓，但必須不改變聽牌
 */
function canAddedKong(pid) {
  const pl = S.players[pid];
  const res = [];
  
  // 不允許在剩餘牌數過少時加槓
  if ((S.wall.length + S.deadWall.length) <= 3) return res;
  
  // 如果已經有三個槓，則不再允許加槓
  if (countKongs(pl) >= 3) return res;
  
  // 一回合只能碰或槓：如果本回合剛碰了牌，不能立即加槓，需要等到下回合
  if (S.lastAction === 'pong' && S.lastActor === pid && S.turn === pid) {
    return res;
  }
  
  pl.melds.forEach((m, idx) => {
    if (m.type === 'pong') {
      const k = tileKey(m.tiles[0]);
      // 檢查手牌中是否還有同樣一張
      const hasFourth = pl.hand.some(t => tileKey(t) === k);
      
      if (hasFourth) {
        // 如果已報聽，需要檢查加槓後是否仍能保持相同的聽牌
        if (pl.declaredListen && pl.waitKeys && pl.waitKeys.length > 0) {
          // 加槓後的手牌
          const afterKong = pl.hand.filter(t => tileKey(t) !== k);
          
          // 檢查加槓後是否仍聽牌
          const tempMelds = pl.melds.slice();
          tempMelds[idx] = { ...tempMelds[idx], type: 'kong' };
          
          if (!isListening(afterKong, tempMelds)) {
            return;  // 不能加槓
          }
          
          // 檢查等牌是否相同
          const newWaits = calcWaitingTiles(afterKong, tempMelds);
          const oldWaits = pl.waitKeys;
          
          if (newWaits.length !== oldWaits.length) return;
          if (!newWaits.every(w => oldWaits.includes(w))) return;
        }
        
        res.push({ meldIndex: idx, key: k });
      }
    }
  });
  
  return res;
}

// 執行暗槓
function doConcealedKong(pid, key) {
  const pl = S.players[pid];
  // 從手牌中取出四張相同的牌
  const tiles = [];
  for (let i = pl.hand.length - 1; i >= 0; i--) {
    const t = pl.hand[i];
    if (tileKey(t) === key) {
      tiles.push(pl.hand.splice(i, 1)[0]);
      if (tiles.length === 4) break;
    }
  }
  // 將此組加入副露，標記為暗槓
  pl.melds.push({ type: 'kong', tiles: tiles, concealed: true });
  S.kongCount++; // 槓牌次數+1，海底多保留1張
  // 其他家暗槓時不顯示槓哪張牌
  if (pid === 0) {
    log(`💥 ${playerName(pid)} 暗槓 ${keyToText(key)}`);
  } else {
    log(`💥 ${playerName(pid)} 暗槓`);
  }
  // 暗槓特效與音效（所有玩家）
  showEffect('💥 暗槓', '#9C27B0');
  playSound(700, 0.3, 'sawtooth');
  // 暗槓後從王牌補牌
  if (S.deadWall.length > 0) {
    const newTile = S.deadWall.pop();
    pl.hand.push(newTile);
  } else if (S.wall.length > 0) {
    const newTile = S.wall.pop();
    pl.hand.push(newTile);
  }
  S.remain = S.wall.length;
  renderAll();
  // 檢查槓後是否可以自摸
  const t = pl.hand[pl.hand.length - 1];
  if (pid === 0) {
    // 玩家暗槓後檢查是否自摸
    if (isWinningNow(pl.hand, pl.melds, t)) {
      document.getElementById('btnHu').disabled = false;
      log('✨ 你可以自摸（按「胡牌」）或繼續出牌');
    }
    // 檢查是否可以報聽：暗槓後不立即彈出報聽面板，待出牌或按鈕時處理
  } else {
    // AI暗槓後，直接檢查自摸
    if (isWinningNow(pl.hand, pl.melds, t)) {
      doWin(pid, -1, t, true);
      return;
    }
    // AI繼續行動
    setTimeout(stepAI, 400 + Math.random() * 400);  // 0.4-0.8秒快速出牌
  }

  // 更新最後動作與執行者：暗槓後已補牌，不再立即摸牌
  S.lastAction = 'concealedKong';
  S.lastActor = pid;
}

// 執行加槓：將已碰的三張牌補為四張
function doAddedKong(pid, meldIndex) {
  const pl = S.players[pid];
  const meld = pl.melds[meldIndex];
  // 已經是槓牌的不再加槓
  if (!meld || meld.type !== 'pong') return;
  const key = tileKey(meld.tiles[0]);
  // 從手牌中取出第4張
  let idx = -1;
  for (let i = 0; i < pl.hand.length; i++) {
    if (tileKey(pl.hand[i]) === key) {
      idx = i;
      break;
    }
  }
  if (idx < 0) return;
  const tile = pl.hand.splice(idx, 1)[0];
  meld.tiles.push(tile);
  meld.type = 'kong';
  meld.added = true;
  // 加槓仍屬明牌，已經存在碰
  S.anyOpenMeld = true;
  S.kongCount++;
  log(`💥 ${playerName(pid)} 加槓 ${keyToText(key)}`);
  // 加槓特效與音效（所有玩家）
  showEffect('💥 槓', '#FF5722');
  playSound(650, 0.3, 'sawtooth');
  // 從王牌補牌
  if (S.deadWall.length > 0) {
    const newTile = S.deadWall.pop();
    pl.hand.push(newTile);
  } else if (S.wall.length > 0) {
    const newTile = S.wall.pop();
    pl.hand.push(newTile);
  }
  S.remain = S.wall.length;
  // 標記槓上開花旗標
  pl.rinshan = true;

  renderAll();
  // 槓後檢查是否自摸
  const t = pl.hand[pl.hand.length - 1];
  if (pid === 0) {
    if (isWinningNow(pl.hand, pl.melds, t)) {
      document.getElementById('btnHu').disabled = false;
      log('✨ 你可以自摸（按「胡牌」）或繼續出牌');
    }
    // 檢查是否可以報聽：加槓後不立即彈出報聽面板，待出牌或按鈕時處理
  } else {
    // AI 加槓後檢查自摸
    if (isWinningNow(pl.hand, pl.melds, t)) {
      doWin(pid, -1, t, true);
      return;
    }
    setTimeout(stepAI, 400 + Math.random() * 400);  // 0.4-0.8秒快速出牌
  }

  // 更新最後動作與執行者：加槓後已補牌，不再立即摸牌
  S.lastAction = 'addedKong';
  S.lastActor = pid;
}

function doPong(pid, tile) {
  const pl = S.players[pid];

  const k = tileKey(tile);
  const tiles = [tile];
  for (let i = 0; i < 2; i++) {
    const idx = pl.hand.findIndex(t => tileKey(t) === k);
    if (idx >= 0) {
      tiles.push(pl.hand.splice(idx, 1)[0]);
    }
  }

  // 更新最後動作與執行者：碰牌後下一步應出牌，不再摸牌
  S.lastAction = 'pong';
  S.lastActor = pid;
  pl.melds.push({ type: 'pong', tiles });
  // 做碰屬於明牌，設定已出現明吃碰槓
  S.anyOpenMeld = true;
  log(`🔥 ${playerName(pid)} 碰了 ${keyToText(k)}`);
  // 碰牌特效與音效（所有玩家）
  showEffect('🔥 碰', '#FFC107');
  playSound(550, 0.25, 'square');
  
  // 從棄牌區移除被碰的牌
  if (S.lastDiscard && S.lastDiscard.from !== undefined) {
    removeDiscardFromArea(S.lastDiscard.from);
  }
  
  S.turn = pid;
  S.lastDiscard = null;
  S.waitReact = null;
  hideReactionPanel();
  renderAll();

  // 若是玩家碰牌，不立即彈出報聽面板；待丟牌後再判斷聽牌
}

function doKong(pid, tile) {
  const pl = S.players[pid];


  // 已移除4組副露限制的早期返回，限制已由 canKong 控制
  const k = tileKey(tile);
  const tiles = [tile];
  for (let i = 0; i < 3; i++) {
    const idx = pl.hand.findIndex(t => tileKey(t) === k);
    if (idx >= 0) {
      tiles.push(pl.hand.splice(idx, 1)[0]);
    }
  }
  pl.melds.push({ type: 'kong', tiles });
  // 明槓屬於明牌，記錄已開碰吃槓
  S.anyOpenMeld = true;
  S.kongCount++; // 槓牌次數+1，海底多保留1張
  log(`💥 ${playerName(pid)} 槓了 ${keyToText(k)}，從王牌補牌`);
  // 明槓特效與音效（所有玩家）
  showEffect('💥 槓', '#FF5722');
  playSound(650, 0.3, 'sawtooth');
  
  // 從棄牌區移除被槓的牌
  if (S.lastDiscard && S.lastDiscard.from !== undefined) {
    removeDiscardFromArea(S.lastDiscard.from);
  }
  
  // 槓牌後從王牌補牌
  if (S.deadWall.length > 0) {
    const newTile = S.deadWall.pop();
    pl.hand.push(newTile);
  } else if (S.wall.length > 0) {
    const newTile = S.wall.pop();
    pl.hand.push(newTile);
  }
  S.remain = S.wall.length;
  // 更新最後動作與執行者：明槓後已補牌，不再立即摸牌
  S.lastAction = 'kong';
  S.lastActor = pid;
  S.turn = pid;
  S.lastDiscard = null;
  S.waitReact = null;
  hideReactionPanel();
  renderAll();

  // 若由玩家進行明槓，補牌後檢查自摸及聽牌
  if (pid === 0) {
    const me = S.players[0];
    // 檢查補牌後是否自摸
    const t = me.hand[me.hand.length - 1];
    if (isWinningNow(me.hand, me.melds, t)) {
      document.getElementById('btnHu').disabled = false;
      log('✨ 你可以自摸（按「胡牌」）或繼續出牌');
    }
    // 檢查是否可報聽
    if (!me.declaredListen) {
      const kongCount = countKongs(me);
      const totalTiles = me.hand.length + me.melds.reduce((sum, m) => sum + m.tiles.length, 0);
      const expectedFull = 17 + kongCount;
      if (totalTiles === expectedFull) {
        const canListenNow = me.hand.some(tile2 => {
          const testHand = me.hand.filter(t => t !== tile2);
          return isListening(testHand, me.melds);
        });
        if (canListenNow) showListenPanel();
      }
    }
  }
}

/* ========= 出牌與反應 ========= */
function discard(p, tile) {
  const hand = S.players[p].hand;
  const i = hand.indexOf(tile);
  if (i < 0) return;
  hand.splice(i, 1);
  // 打出牌後，重置本家剛摸的牌記錄
  S.players[p].drawnTile = null;
  // 丟牌音效
  playSound(400, 0.1, 'square');

  // 更新最後動作與執行者為出牌
  S.lastAction = 'discard';
  S.lastActor = p;
  log(`🎴 ${playerName(p)} 打出 ${keyToText(tileKey(tile))}`);

  // 打出牌後，非槓補牌的自摸旗標重置
  S.players[p].rinshan = false;
  
  // 打出牌後，若當前手牌在聽牌狀態，顯示等待牌提示（不用宣告聽牌）。
  {
    const pl = S.players[p];
    const kc = countKongs(pl);
    const totalP = pl.hand.length + pl.melds.reduce((sum, m) => sum + m.tiles.length, 0);
    const expFull = 17 + kc;
    const expEmpty = 16 + kc;
    let ting = false;
    if (totalP === expFull) {
      // 測試打出任何一張是否能聽牌
      ting = pl.hand.some(tt => {
        const test = pl.hand.filter(x => x !== tt);
        return isListening(test, pl.melds);
      });
    } else if (totalP === expEmpty) {
      ting = isListening(pl.hand, pl.melds);
    }
    if (ting) {
      const waits = calcWaitingTiles(pl.hand, pl.melds);
      pl.waitKeys = waits.slice();
      if (waits.length > 0) {
        const waitText = waits.map(k => keyToText(k)).join(' ');
        // 僅當自己打牌時才在戰況記錄顯示等待牌，其他家不需要提醒
        if (p === 0) {
          log('👂 等牌：' + waitText);
        }
      }
    } else {
      pl.waitKeys = [];
    }
  }
  
  // 先檢查其他玩家是否可以胡、碰、槓、吃（收集所有可能的反應）
  // 按照逆時針順序檢查：0 → 3 → 1 → 2
  let reactions = [];
  const counterClockwiseOrder = [0, 3, 1, 2];
  const currentIndex = counterClockwiseOrder.indexOf(p);
  
  for (let k = 1; k <= 3; k++) {
    const pid = counterClockwiseOrder[(currentIndex + k) % 4];
    if (pid === p) continue;
    
    // 胡牌優先級最高
    if (canWinOn(pid, tile)) {
      reactions.push({ pid, type: 'hu', tile });
    }
    // 收集所有可能的反應（不使用 else，讓玩家可以選擇）
    if (canKong(pid, tile)) {
      reactions.push({ pid, type: 'kong', tile });
    }
    if (canPong(pid, tile)) {
      reactions.push({ pid, type: 'pong', tile });
    }
    const chowPatterns = canChow(pid, tile);
    if (chowPatterns.length > 0) {
      reactions.push({ pid, type: 'chow', tile, patterns: chowPatterns });
    }
  }
  
  // 設置 lastDiscard，用於後續處理
  S.lastDiscard = { tile, from: p };
  
  if (reactions.length > 0) {
    // 有反應，先不加入棄牌區，等待反應完成後再處理
    S.waitReact = reactions;
    renderAll();
    
    if (reactions.some(r => r.pid === 0)) {
      showReactionPanel(reactions.filter(r => r.pid === 0));
    } else {
      setTimeout(() => handleAIReaction(reactions), 300 + Math.random() * 300);  // 0.3-0.6秒快速反應
    }
  } else {
    // 沒有反應，直接加入棄牌區，換下家出牌
    S.players[p].discards.push(tile);
    S.turn = getNextTurn(p);
    S.lastDiscard = null;
    renderAll();
    stepNext();
  }
}

// 將牌加入棄牌區（當沒有反應或反應完成後）
function moveDiscardToArea() {
  if (!S.lastDiscard) {
    return;
  }
  
  const { tile, from } = S.lastDiscard;
  // 將牌加入棄牌區
  S.players[from].discards.push(tile);
}

// 從棄牌區移除被吃碰槓的牌
function removeDiscardFromArea(playerIndex) {
  if (playerIndex < 0 || playerIndex >= 4) return;
  const discards = S.players[playerIndex].discards;
  if (discards.length > 0) {
    discards.pop(); // 移除最後一張（剛打出的牌）
  }
}

function showReactionPanel(reactions) {
  // 新規則：如果已報聽，過濾掉吃、碰、明槓的選項
  const me = S.players[0];
  if (me.declaredListen) {
    // 已聽牌，只保留胡牌選項，移除吃碰槓
    reactions = reactions.filter(r => r.type === 'hu');
    if (reactions.length === 0) {
      // 沒有可用選項，自動過，將牌加入棄牌區
      clearReactionButtons();
      if (S.lastDiscard) {
        moveDiscardToArea();
        S.turn = getNextTurn(S.lastDiscard.from);
        S.lastDiscard = null;
      } else {
        S.turn = getNextTurn(S.turn);
      }
      S.waitReact = null;
      renderAll();
      stepNext();
      return;
    }
    
    // 自動模式：如果已報聽且啟用自動模式，自動胡牌
    if (me.autoMode && reactions.some(r => r.type === 'hu')) {
      const huReaction = reactions.find(r => r.type === 'hu');
      if (huReaction) {
        setTimeout(() => {
          handleHuClick();
        }, 500);
        return;
      }
    }
  }
  
  // 檢查是否有槓的選項，如果有，需要玩家手動操作
  const kongReactions = reactions.filter(r => r.type === 'kong');
  if (kongReactions.length > 0) {
    // 有槓的選項，顯示給玩家選擇，不自動執行
    // 清除所有按鈕的亮燈狀態
    clearReactionButtons();
    
    // 儲存當前反應選項，供按鈕點擊時使用
    S.currentReactions = reactions;
    
    // 根據反應類型亮起對應按鈕
    reactions.forEach(r => {
      if (r.type === 'hu') {
        document.getElementById('btnHu').classList.add('active');
        document.getElementById('btnHu').disabled = false;
      } else if (r.type === 'pong') {
        document.getElementById('btnPong').classList.add('active');
        document.getElementById('btnPong').disabled = false;
      } else if (r.type === 'kong') {
        document.getElementById('btnKong').classList.add('active');
        document.getElementById('btnKong').disabled = false;
      } else if (r.type === 'chow') {
        document.getElementById('btnChow').classList.add('active');
        document.getElementById('btnChow').disabled = false;
      }
    });
    
    // 亮起「過」按鈕
    document.getElementById('btnPass').classList.add('active');
    document.getElementById('btnPass').disabled = false;
    return;
  }
  
  // 清除所有按鈕的亮燈狀態
  clearReactionButtons();
  
  // 儲存當前反應選項，供按鈕點擊時使用
  S.currentReactions = reactions;
  
  // 根據反應類型亮起對應按鈕
  reactions.forEach(r => {
    if (r.type === 'hu') {
      document.getElementById('btnHu').classList.add('active');
      document.getElementById('btnHu').disabled = false;
    } else if (r.type === 'pong') {
      document.getElementById('btnPong').classList.add('active');
      document.getElementById('btnPong').disabled = false;
    } else if (r.type === 'kong') {
      document.getElementById('btnKong').classList.add('active');
      document.getElementById('btnKong').disabled = false;
    } else if (r.type === 'chow') {
      document.getElementById('btnChow').classList.add('active');
      document.getElementById('btnChow').disabled = false;
    }
  });
  
  // 亮起「過」按鈕
  document.getElementById('btnPass').classList.add('active');
  document.getElementById('btnPass').disabled = false;
}

function hideReactionPanel() {
  document.getElementById('reactionPanel').style.display = 'none';
  document.getElementById('overlay').style.display = 'none';
}

// 清除所有反應按鈕的亮燈狀態
function clearReactionButtons() {
  const buttons = ['btnHu', 'btnChow', 'btnPong', 'btnKong', 'btnPass'];
  buttons.forEach(id => {
    const btn = document.getElementById(id);
    if (btn) {
      btn.classList.remove('active');
      btn.disabled = true;
    }
  });
}

// 處理吃牌按鈕點擊
function handleChowClick() {
  if (!S.currentReactions) return;
  const chowReact = S.currentReactions.find(r => r.type === 'chow');
  if (!chowReact) return;
  
  // 如果有多種吃法，顯示選擇面板
  if (chowReact.patterns && chowReact.patterns.length > 1) {
    showChowSelectionPanel(chowReact);
  } else {
    // 只有一種吃法，直接執行
    doChow(chowReact.pid, chowReact.tile, chowReact.patterns[0]);
    clearReactionButtons();
  }
}

// 顯示吃牌選擇面板
function showChowSelectionPanel(chowReact) {
  const panel = document.getElementById('reactionPanel');
  const overlay = document.getElementById('overlay');
  
  let html = '<div class="reaction-panel"><h3>🍜 選擇吃法</h3><div class="row">';
  chowReact.patterns.forEach((pat, idx) => {
    const patText = [...pat].sort((a, b) => a - b).join(' ');
    html += `<button class="chowOpt" data-idx="${idx}">🍜 ${patText}</button>`;
  });
  html += '</div><div class="row"><button id="cancelChow">❌ 取消</button></div></div>';
  
  panel.innerHTML = html;
  panel.style.display = 'block';
  overlay.style.display = 'block';
  
  // 綁定每個吃法按鈕的事件
  const opts = panel.querySelectorAll('.chowOpt');
  opts.forEach(btn => {
    const idx = parseInt(btn.getAttribute('data-idx'));
    btn.onclick = () => {
      doChow(chowReact.pid, chowReact.tile, chowReact.patterns[idx]);
      panel.style.display = 'none';
      overlay.style.display = 'none';
      clearReactionButtons();
    };
  });
  
  // 取消按鈕
  document.getElementById('cancelChow').onclick = () => {
    panel.style.display = 'none';
    overlay.style.display = 'none';
  };
}

// 處理碰牌按鈕點擊
function handlePongClick() {
  if (!S.currentReactions) return;
  const pongReact = S.currentReactions.find(r => r.type === 'pong');
  if (!pongReact) return;
  
  doPong(pongReact.pid, pongReact.tile);
  clearReactionButtons();
}

// 處理槓牌按鈕點擊
function handleKongClick() {
  if (!S.currentReactions) return;
  const kongReact = S.currentReactions.find(r => r.type === 'kong');
  if (!kongReact) return;
  
  doKong(kongReact.pid, kongReact.tile);
  clearReactionButtons();
}

// 處理胡牌按鈕點擊
function handleHuClick() {
  if (!S.currentReactions) return;
  const huReact = S.currentReactions.find(r => r.type === 'hu');
  if (!huReact) return;
  
  doWin(huReact.pid, S.lastDiscard.from, huReact.tile, false);
  clearReactionButtons();
}

// 處理過按鈕點擊
function handlePassClick() {
  clearReactionButtons();
  // 將牌加入棄牌區
  if (S.lastDiscard) {
    moveDiscardToArea();
    S.turn = getNextTurn(S.lastDiscard.from);
    S.lastDiscard = null;
  } else {
    S.turn = getNextTurn(S.turn);
  }
  S.waitReact = null;
  S.currentReactions = null;
  renderAll();
  stepNext();
}

// 顯示報聽選擇面板：當玩家可以宣告聽牌時，彈出此面板讓玩家選擇是否報聽
function showListenPanel() {
  const panel = document.getElementById('reactionPanel');
  const overlay = document.getElementById('overlay');
  let html = '<div class="reaction-panel">';
  html += '<h3>🔔 是否報聽？</h3>';
  html += '<div class="row">';
  html += '<button id="listenYes">🔔 聽牌</button>';
  html += '<button id="listenNo">⏭️ 不聽</button>';
  html += '</div></div>';
  panel.innerHTML = html;
  panel.style.display = 'block';
  overlay.style.display = 'block';
  document.getElementById('listenYes').onclick = () => {
    const me = S.players[0];
    if (!me.declaredListen) {
      // 標記已報聽但尚未鎖定
      me.declaredListen = true;
      me.tingLocked = false; // 新增：標記聽牌尚未鎖定
      // 檢查天聽/地聽
      updateTianDiTing(0);
      // 計算聽牌時可以胡哪些牌，並提示
      const waitKeys = calcWaitingTiles(me.hand, me.melds);
      const waitText = waitKeys.map(k => keyToText(k)).join(' ');
      // 記錄日誌，不同狀況顯示不同訊息
      if (me.tianTing) {
        log('🔔 你宣告天聽！胡牌時多 ' + RULES.scoring.HeavenReady + ' 台');
      } else if (me.diTing) {
        log('🔔 你宣告地聽！胡牌時多 ' + RULES.scoring.EarthReady + ' 台');
      } else {
        log('🔔 你宣告聽牌！胡牌時多 1 台');
      }
      log('⚠️ 請丟一張手牌後鎖定聽牌');
      // 顯示等待牌提示
      if (waitKeys.length > 0) {
        // 將等待牌儲存於玩家狀態，以便在玩家區塊或記分板顯示
        me.waitKeys = waitKeys.slice();
        log('👂 等待牌：' + waitText);
      } else {
        me.waitKeys = [];
      }
    }
    hideReactionPanel();
    renderAll();
  };
  document.getElementById('listenNo').onclick = () => {
    hideReactionPanel();
    // 玩家選擇不報聽，維持原狀繼續遊戲
  };
}

/**
 * AI 處理反應（吃碰槓胡）- 優化版本
 * 更智能的決策邏輯
 */
function handleAIReaction(reactions) {
  // 胡牌優先級最高
  const huReact = reactions.find(r => r.type === 'hu');
  if (huReact) {
    doWin(huReact.pid, S.lastDiscard.from, huReact.tile, false);
    return;
  }
  
  // AI報聽後不能吃碰，只能槓或胡
  reactions = reactions.filter(r => {
    const p = S.players[r.pid];
    if (p.declaredListen) {
      return r.type === 'hu' || r.type === 'kong';
    }
    return true;
  });
  
  // 按優先級處理反應（槓 > 碰 > 吃）
  const kongReact = reactions.find(r => r.type === 'kong');
  const pongReact = reactions.find(r => r.type === 'pong');
  const chowReact = reactions.find(r => r.type === 'chow');
  
  // === 槓牌決策 ===
  if (kongReact) {
    const me = S.players[kongReact.pid];
    const currentShanten = shantenAfterRemove(me.hand);
    
    // 如果向聽數較低（接近胡牌），更傾向槓
    const kongChance = currentShanten <= 2 ? 0.9 : 0.7;
    
    if (Math.random() < kongChance) {
      doKong(kongReact.pid, kongReact.tile);
      setTimeout(stepAI, 400 + Math.random() * 400);
      return;
    }
  }
  
  // === 碰牌決策 ===
  if (pongReact) {
    const me = S.players[pongReact.pid];
    const tile = pongReact.tile;
    const k = tileKey(tile);
    
    // 評估碰牌前後的向聽數
    const shBefore = shantenAfterRemove(me.hand);
    
    // 模擬碰牌後的手牌（移除兩張相同的牌）
    let tempHand = me.hand.slice();
    let removed = 0;
    tempHand = tempHand.filter(t => {
      if (removed < 2 && tileKey(t) === k) {
        removed++;
        return false;
      }
      return true;
    });
    const shAfter = shantenAfterRemove(tempHand);
    const improvement = shBefore - shAfter;
    
    // 計算碰牌是否有利
    let shouldPong = false;
    
    // 1. 字牌刻子很有價值（三元牌、風牌）
    if (tile.suit === SUIT_D) {
      shouldPong = true;  // 三元牌一定碰
    } else if (tile.suit === SUIT_F) {
      // 風牌看情況
      const playerWind = seatNames[pongReact.pid];
      const roundWind = ['東', '南', '西', '北'][S.round - 1];
      const windMap = { 'E': '東', 'S': '南', 'W': '西', 'N': '北' };
      if (windMap[tile.name] === playerWind || windMap[tile.name] === roundWind) {
        shouldPong = true;  // 門風或圈風一定碰
      } else {
        shouldPong = Math.random() < 0.7;  // 其他風牌 70% 碰
      }
    } else {
      // 數字牌：根據向聽數改善決定是否碰
      if (improvement > 0) {
        // 向聽數有改善，高概率碰
        shouldPong = Math.random() < 0.9;
      } else if (improvement === 0 && shBefore <= 2) {
        // 向聽數不變但接近聽牌
        shouldPong = Math.random() < 0.75;
      } else if (shBefore <= 3) {
        shouldPong = Math.random() < 0.55;
      } else {
        shouldPong = Math.random() < 0.35;
      }
    }
    
    if (shouldPong) {
      doPong(pongReact.pid, pongReact.tile);
      setTimeout(stepAI, 400 + Math.random() * 400);
      return;
    }
  }
  
  // === 吃牌決策 ===
  if (chowReact) {
    const me = S.players[chowReact.pid];
    const tile = chowReact.tile;
    const patterns = chowReact.patterns;
    
    // 計算當前向聽數
    const shBefore = shantenAfterRemove(me.hand);
    
    // 評估每種吃法
    let bestPattern = null;
    let bestImprovement = -99;
    
    patterns.forEach(pattern => {
      const suit = tile.suit;
      // 模擬吃牌後的手牌
      let tempHand = me.hand.slice();
      const toRemove = pattern.filter(r => r !== tile.rank);
      
      toRemove.forEach(rank => {
        const idx = tempHand.findIndex(t => t.suit === suit && t.rank === rank);
        if (idx >= 0) tempHand.splice(idx, 1);
      });
      
      // 吃牌後需要少一張
      if (tempHand.length > 16 - (me.melds.length + 1) * 3 - 2) {
        tempHand = tempHand.slice(0, -1);
      }
      
      const shAfter = shantenAfterRemove(tempHand);
      const improvement = shBefore - shAfter;
      
      if (improvement > bestImprovement) {
        bestImprovement = improvement;
        bestPattern = pattern;
      }
    });
    
    // 只有在向聽數有改善或保持不變時才吃
    if (bestPattern && bestImprovement >= 0) {
      // 根據向聽數改善程度決定吃牌概率
      let chowChance = 0.3;
      if (bestImprovement > 0) chowChance = 0.8;
      else if (shBefore <= 2) chowChance = 0.6;
      
      if (Math.random() < chowChance) {
        doChow(chowReact.pid, tile, bestPattern);
        setTimeout(stepAI, 400 + Math.random() * 400);
        return;
      }
    }
  }
  
  // 沒有執行任何反應，將牌加入棄牌區，輪到下一家
  if (S.lastDiscard) {
    moveDiscardToArea();
    const fromPlayer = S.lastDiscard.from;
    S.lastDiscard = null;
    S.turn = getNextTurn(fromPlayer);
  } else {
    S.turn = getNextTurn(S.turn);
  }
  S.waitReact = null;
  setTimeout(stepNext, 100);
}

function canWinOn(pid, tile) {
  const pl = S.players[pid];
  // 判斷他家打出的牌是否能胡牌，不限制副露組數（副露上限由其他邏輯控制）
  const tmp = pl.hand.concat([tile]);
  return isWinningNow(tmp, pl.melds, tile);
}

function doWin(winner, from, tile, selfDraw) {
  // 如果不是自摸，從棄牌區移除被胡的牌
  if (!selfDraw && from !== undefined && from >= 0 && from < 4) {
    removeDiscardFromArea(from);
  }
  
  S.winner = winner;
  S.fromPlayer = from;
  S.winTile = tile;
  S.phase = 'end';
  // 胡牌特效與音效（所有玩家）
  showEffect('🎉 胡了！', '#FFD700', '64px');
  playSound(800, 0.5, 'sine');
  setTimeout(() => playSound(1000, 0.5, 'sine'), 200);
  // 計算台數與獎勵細節
  const detail = calcFanDetails(winner, tile, selfDraw);
  const fan = detail.fan;
  const delta = RULES.points.base + fan * RULES.points.perFan;
  
  const catStr = detail.categories.join('、');
  
  // 計算連莊台數（如果適用）
  // 注意：calcFanDetails 已經將連莊台數包含在 fan 中，但分數計算需要特別處理
  // 因為連莊台數只影響莊家與抓莊家的閒家之間的交易
  let dealerStreakFan = 0;
  if (winner === S.dealer) {
    // 莊家胡牌：連莊台數已包含在 fan 中，所有閒家都支付相同金額
    dealerStreakFan = 0; // 已在 calcFanDetails 中計算，無需額外處理
  } else if ((!selfDraw && from === S.dealer) || (selfDraw && winner !== S.dealer)) {
    // 閒家抓莊家：需要額外計算連莊台數的點數
    if (S.dealerStreak > 0) {
      dealerStreakFan = RULES.dealerStreakMultiplier * S.dealerStreak + RULES.dealerStreakBase;
    } else {
      dealerStreakFan = RULES.scoring.Dealer; // 起莊基本 1 台
    }
  }
  
  if (selfDraw) {
    // 自摸：向所有其他玩家收取
    for (let i = 0; i < 4; i++) {
      if (i !== winner) {
        S.players[i].points -= delta;
        // 如果是閒家自摸且對方是莊家，莊家需額外支付連莊台數
        if (winner !== S.dealer && i === S.dealer && dealerStreakFan > 0) {
          const streakDelta = dealerStreakFan * RULES.points.perFan;
          S.players[i].points -= streakDelta;
          S.players[winner].points += streakDelta;
        }
      }
    }
    S.players[winner].points += delta * 3;
    
    if (winner !== S.dealer && dealerStreakFan > 0) {
      const streakDelta = dealerStreakFan * RULES.points.perFan;
      log(`🎉 ${playerName(winner)} 自摸 ${keyToText(tileKey(tile))}（${catStr}，共${fan}台）→ 每家付 ${delta.toLocaleString()}，莊家額外付連莊 ${dealerStreakFan}台（${streakDelta.toLocaleString()}）`);
    } else {
      log(`🎉 ${playerName(winner)} 自摸 ${keyToText(tileKey(tile))}（${catStr}，共${fan}台）→ 每家付 ${delta.toLocaleString()}`);
    }
  } else {
    // 點炮：放槍者支付
    S.players[from].points -= delta * 3;
    S.players[winner].points += delta * 3;
    
    // 如果是閒家點炮莊家，莊家需額外支付連莊台數
    if (winner !== S.dealer && from === S.dealer && dealerStreakFan > 0) {
      const streakDelta = dealerStreakFan * RULES.points.perFan;
      S.players[from].points -= streakDelta;
      S.players[winner].points += streakDelta;
      log(`🎉 ${playerName(winner)} 點胡 ${playerName(from)}（${keyToText(tileKey(tile))}，${catStr}，共${fan}台）→ 放槍者付 ${(delta * 3).toLocaleString()}，莊家額外付連莊 ${dealerStreakFan}台（${streakDelta.toLocaleString()}）`);
    } else {
      log(`🎉 ${playerName(winner)} 點胡 ${playerName(from)}（${keyToText(tileKey(tile))}，${catStr}，共${fan}台）→ 放槍者付 ${(delta * 3).toLocaleString()}`);
    }
  }
  
  renderAll();

  // 清除槓上開花及搶槓旗標
  S.players[winner].rinshan = false;
  S.robKong = false;

  // 清除槓上開花旗標
  S.players[winner].rinshan = false;
  
  for (let i = 0; i < 4; i++) {
    if (S.players[i].points <= 0) {
      log(`⚠️ ${playerName(i)} 破產，遊戲結束`);
      setTimeout(() => showFinalScore(), 1500);
      return;
    }
  }
  
  // 顯示所有玩家手牌和繼續按鈕
  setTimeout(() => showHandsAndContinue(), 1000);
}

/**
 * 計算胡牌台數（簡化版，調用 calcFanDetails）
 */
function calcFan(winner, winTile, selfDraw) {
  const detail = calcFanDetails(winner, winTile, selfDraw);
  return detail.fan;
}

/**
 * 計算胡牌時各個獎勵台數細節。
 * 完整的台灣16張麻將台數計算系統
 * 會回傳一個物件，包含總台數 fan 和一組 categories 用於顯示名稱。
 */
function calcFanDetails(winner, winTile, selfDraw) {
  const pl = S.players[winner];
  const handWithWin = pl.hand.concat([winTile]);
  const allTiles = handWithWin.concat(pl.melds.flatMap(m => m.tiles));
  let fan = 0;
  const categories = [];
  
  // === 統計牌型資訊 ===
  const counts = countByKey(allTiles);
  const handCounts = countByKey(handWithWin);
  
  // 統計花色和字牌
  const suitCnt = { W: 0, T: 0, B: 0 };
  let honorCount = 0;
  let windCount = { E: 0, S: 0, W: 0, N: 0 };
  let dragonCount = { C: 0, F: 0, B: 0 };
  
  for (const t of allTiles) {
    const k = tileKey(t);
    const s = k[0];
    if (s === 'W' || s === 'T' || s === 'B') {
      suitCnt[s]++;
    } else if (s === 'F') {
      honorCount++;
      const wind = k.slice(1);
      windCount[wind] = (windCount[wind] || 0) + 1;
    } else if (s === 'D') {
      honorCount++;
      const dragon = k.slice(1);
      dragonCount[dragon] = (dragonCount[dragon] || 0) + 1;
    }
  }
  
  // 統計刻子和順子
  const pungKeys = [];  // 刻子的key
  const kongKeys = [];  // 槓子的key
  const chowCount = pl.melds.filter(m => m.type === 'chow').length;
  
  // 統計副露中的刻子和槓子
  pl.melds.forEach(m => {
    if (m.type === 'pong') pungKeys.push(tileKey(m.tiles[0]));
    if (m.type === 'kong') kongKeys.push(tileKey(m.tiles[0]));
  });
  
  // 計算暗刻數量（手牌中的刻子）
  let concealedPungs = 0;
  const tempCounts = countByKey(handWithWin);
  for (const k in tempCounts) {
    if (tempCounts[k] >= 3) concealedPungs++;
  }
  
  // === 特殊高階牌型（優先判斷）===
  
  // 天胡：莊家起手17張牌直接胡牌
  if (winner === S.dealer && S.drawCount === 0 && selfDraw && pl.melds.length === 0) {
    fan += RULES.scoring.HeavenWin;
    categories.push('天胡');
    return { fan: Math.max(24, fan), categories };  // 天胡直接返回
  }
  
  // 地胡：閒家起手聽牌，第一巡摸牌即胡（需無人吃碰）
  if (winner !== S.dealer && S.drawCount <= 4 && selfDraw && !S.anyOpenMeld && pl.melds.length === 0) {
    fan += RULES.scoring.EarthWin;
    categories.push('地胡');
  }
  
  // 人胡：閒家起手聽牌，第一巡由他人放銃胡牌
  if (winner !== S.dealer && S.drawCount <= 4 && !selfDraw && !S.anyOpenMeld && pl.melds.length === 0) {
    fan += RULES.scoring.HumanWin;
    categories.push('人胡');
  }
  
  // === 字牌相關牌型 ===
  
  // 大四喜：四組風牌刻子（東南西北）
  const windPungs = Object.values(windCount).filter(c => c >= 3).length;
  if (windPungs === 4) {
    fan += RULES.scoring.BigFourWinds;
    categories.push('大四喜');
  } 
  // 小四喜：三組風牌刻子 + 一組對子
  else if (windPungs === 3 && Object.values(windCount).some(c => c === 2)) {
    fan += RULES.scoring.SmallFourWinds;
    categories.push('小四喜');
  }
  
  // 大三元：三組三元刻子（中發白）
  const dragonPungs = Object.values(dragonCount).filter(c => c >= 3).length;
  if (dragonPungs === 3) {
    fan += RULES.scoring.BigThreeDragons;
    categories.push('大三元');
  }
  // 小三元：兩組三元刻子 + 一組對子
  else if (dragonPungs === 2 && Object.values(dragonCount).some(c => c === 2)) {
    fan += RULES.scoring.SmallThreeDragons;
    categories.push('小三元');
  }
  // 三元牌刻子：單獨計算每組三元牌刻子
  else if (dragonPungs >= 1) {
    fan += dragonPungs * RULES.scoring.DragonPung;
    if (dragonPungs === 1) categories.push('三元牌');
    else categories.push(`${dragonPungs}組三元牌`);
  }
  
  // 字一色：全副牌皆由風牌與箭牌組成
  const nonHonorSuits = Object.values(suitCnt).filter(c => c > 0).length;
  if (nonHonorSuits === 0 && honorCount === allTiles.length) {
    fan += RULES.scoring.AllHonors;
    categories.push('字一色');
  }
  
  // 門風與圈風
  const playerWind = seatNames[winner];
  const roundWind = ['東', '南', '西', '北'][S.round - 1];
  const windToKey = { '東': 'E', '南': 'S', '西': 'W', '北': 'N' };
  
  // 門風：拿到自己門風的刻子
  if (playerWind && windCount[windToKey[playerWind]] >= 3) {
    fan += RULES.scoring.SeatWind;
    categories.push('門風');
  }
  
  // 圈風：拿到當前圈風的刻子
  if (roundWind && windCount[windToKey[roundWind]] >= 3) {
    fan += RULES.scoring.RoundWind;
    categories.push('圈風');
  }
  
  // === 清一色相關 ===
  const usedSuits = Object.entries(suitCnt).filter(([k, v]) => v > 0);
  
  if (usedSuits.length === 1 && honorCount === 0) {
    // 清一色：整副牌皆為同一種花色
    fan += RULES.scoring.PureOneSuit;
    categories.push('清一色');
  } else if (usedSuits.length === 1 && honorCount > 0) {
    // 混一色（湊一色）：一種花色 + 字牌
    fan += RULES.scoring.HalfFlush;
    categories.push('混一色');
  }
  
  // === 組合牌型 ===
  
  // 七對子
  if (isSevenPairs(handWithWin) && pl.melds.length === 0) {
    fan += RULES.scoring.SevenPairs;
    categories.push('七對');
  }
  
  // 對對胡：全部由刻子與一個對子組成（無順子）
  const allTrip = isAllPungsPossible(clone(handCounts));
  const noChows = pl.melds.every(m => m.type !== 'chow');
  if (allTrip && noChows) {
    fan += RULES.scoring.AllPungs;
    categories.push('對對胡');
  }
  
  // 平胡：全順子、無刻、無字牌
  const isAllChows = checkAllChows(handWithWin, pl.melds);
  if (isAllChows && honorCount === 0) {
    fan += RULES.scoring.AllChows;
    categories.push('平胡');
  }
  
  // 暗刻相關
  const totalConcealedPungs = concealedPungs;
  if (totalConcealedPungs >= 5) {
    fan += RULES.scoring.FiveConcealed;
    categories.push('五暗刻');
  } else if (totalConcealedPungs >= 4) {
    fan += RULES.scoring.FourConcealed;
    categories.push('四暗刻');
  } else if (totalConcealedPungs >= 3) {
    fan += RULES.scoring.ThreeConcealed;
    categories.push('三暗刻');
  }
  
  // 全求人：手上剩一張牌，其餘皆吃碰槓，由他人放銃
  if (!selfDraw && pl.hand.length === 1 && pl.melds.length >= 4) {
    fan += RULES.scoring.FullFlush;
    categories.push('全求人');
  }
  
  // === 聽牌相關 ===
  
  // 天聽/地聽/報聽
  if (pl.tianTing) {
    fan += RULES.scoring.HeavenReady;
    categories.push('天聽');
  } else if (pl.diTing) {
    fan += RULES.scoring.EarthReady;
    categories.push('地聽');
  } else if (pl.declaredListen) {
    fan += RULES.scoring.DeclaredListen;
    categories.push('報聽');
  }
  
  // === 自摸相關 ===
  
  if (selfDraw) {
    const isMenQing = pl.melds.length === 0 || pl.melds.every(m => m.concealed);
    if (isMenQing) {
      // 門清自摸（不求人）
      fan += RULES.scoring.MenqingSelfDraw;
      categories.push('門清自摸');
    } else {
      // 普通自摸
      fan += RULES.scoring.SelfDraw;
      categories.push('自摸');
    }
  } else {
    // 非自摸時，檢查門清
    const isMenQing = pl.melds.length === 0 || pl.melds.every(m => m.concealed);
    if (isMenQing) {
      fan += RULES.scoring.MenQing;
      categories.push('門清');
    }
  }
  
  // === 槓牌相關 ===
  
  // 搶槓胡
  if (S.robKong) {
    fan += RULES.scoring.RobKong;
    categories.push('搶槓');
  }
  
  // 槓上開花
  if (selfDraw && pl.rinshan) {
    fan += RULES.scoring.Rinshan;
    categories.push('槓上開花');
  }
  
  // 海底撈月：摸最後一張牌胡牌
  if (selfDraw && S.wall.length === 0) {
    fan += RULES.scoring.Haitei;
    categories.push('海底撈月');
  }
  
  // 河底撈魚：吃最後一張棄牌胡牌
  if (!selfDraw && S.wall.length === 0) {
    fan += RULES.scoring.LastTileWin;
    categories.push('河底撈魚');
  }
  
  // === 莊家與連莊 ===
  // 連莊台數對照表（加計在原本牌型台數之外）：
  // - 莊家（起莊）：1 台（dealerStreak = 0）
  // - 連一拉一：3 台（dealerStreak = 1，公式：2×1+1 = 3）
  // - 連二拉二：5 台（dealerStreak = 2，公式：2×2+1 = 5）
  // - 連三拉三：7 台（dealerStreak = 3，公式：2×3+1 = 7）
  // - 連四拉四：9 台（dealerStreak = 4，公式：2×4+1 = 9）
  // - 連 n 拉 n：2n+1 台（dealerStreak = n，公式：2n+1）
  // 
  // 計算規則：
  // 1. 莊家胡牌：向每位閒家收取「牌型台數 + 連莊台數」
  // 2. 閒家胡牌（抓莊家）：莊家需支付「牌型台數 + 連莊台數」給該閒家
  //    - 閒家自摸：向所有玩家（包括莊家）收取，但莊家需額外支付連莊台數
  //    - 閒家點炮莊家：莊家需支付「牌型台數 + 連莊台數」
  // 3. 閒家胡閒家：與莊家的連莊台數無關，僅計算牌型台數
  const isDealerWin = winner === S.dealer;
  const isCatchingDealer = !selfDraw && from === S.dealer; // 閒家點炮莊家
  const isNonDealerSelfDraw = selfDraw && winner !== S.dealer; // 閒家自摸
  
  if (isDealerWin) {
    // 莊家胡牌：計算連莊台數
    if (S.dealerStreak > 0) {
      // 連莊：連n莊 = 2n+1 台
      const streakFan = RULES.dealerStreakMultiplier * S.dealerStreak + RULES.dealerStreakBase;
      fan += streakFan;
      categories.push(`連${S.dealerStreak}拉${S.dealerStreak}`);
    } else {
      // 莊家基本 1 台（起莊）
      fan += RULES.scoring.Dealer;
      categories.push('莊家');
    }
  } else if (isCatchingDealer || isNonDealerSelfDraw) {
    // 閒家胡牌（抓莊家）：莊家需支付連莊台數
    if (S.dealerStreak > 0) {
      // 連莊：連n莊 = 2n+1 台
      const streakFan = RULES.dealerStreakMultiplier * S.dealerStreak + RULES.dealerStreakBase;
      fan += streakFan;
      categories.push(`抓莊連${S.dealerStreak}拉${S.dealerStreak}`);
    } else {
      // 莊家基本 1 台（起莊）
      fan += RULES.scoring.Dealer;
      categories.push('抓莊');
    }
  }
  // 閒家胡閒家：不計算連莊台數（已通過 else if 排除）
  
  // 總台數至少 1 台
  if (fan < 1) fan = 1;
  return { fan, categories };
}

/**
 * 檢查是否為平胡（全順子）
 */
function checkAllChows(hand, melds) {
  // 檢查副露是否都是順子
  if (melds.some(m => m.type !== 'chow')) return false;
  
  // 檢查手牌是否可以拆成順子+對子
  const counts = countByKey(hand);
  
  // 嘗試找對子
  for (const k in counts) {
    if (counts[k] >= 2) {
      counts[k] -= 2;
      if (canSplitIntoChows(counts)) {
        return true;
      }
      counts[k] += 2;
    }
  }
  return false;
}

/**
 * 檢查是否可以全部拆成順子
 */
function canSplitIntoChows(counts) {
  // 複製counts
  const c = { ...counts };
  
  // 只有數字牌才能組順子
  const sortedKeys = Object.keys(c).filter(k => {
    const s = k[0];
    return s === 'W' || s === 'T' || s === 'B';
  }).sort();
  
  // 字牌不能有剩餘
  for (const k in c) {
    const s = k[0];
    if (s !== 'W' && s !== 'T' && s !== 'B' && c[k] > 0) {
      return false;
    }
  }
  
  // 嘗試從最小的牌開始拆順子
  for (const k of sortedKeys) {
    while (c[k] > 0) {
      const s = k[0];
      const v = parseInt(k.slice(1));
      if (v > 7) return false;  // 8, 9 不能作為順子起點
      
      const k2 = s + (v + 1);
      const k3 = s + (v + 2);
      
      if ((c[k2] || 0) > 0 && (c[k3] || 0) > 0) {
        c[k]--;
        c[k2]--;
        c[k3]--;
      } else {
        return false;
      }
    }
  }
  
  return Object.values(c).every(v => v === 0);
}

function isAllPungsPossible(counts) {
  for (const k in counts) {
    if (counts[k] >= 2) {
      counts[k] -= 2;
      let ok = true;
      for (const kk in counts) {
        if (counts[kk] % 3 !== 0) {
          ok = false;
          break;
        }
      }
      counts[k] += 2;
      if (ok) return true;
    }
  }
  return false;
}

function stepNext() {
  renderAll();

    // 輪到玩家
    const me = S.players[0];
    // 依總牌數（手牌＋副露）決定是否需要摸牌
    const kongCount = countKongs(me);
    const totalTiles = me.hand.length + me.melds.reduce((sum, m) => sum + m.tiles.length, 0);
    const expectedFull = 17 + kongCount;
    const expectedEmpty = 16 + kongCount;

    if (totalTiles <= expectedEmpty) {
      // 持有張數不足，必須摸牌
      drawTile(0);
      const t = me.hand[me.hand.length - 1];
      
      // 自動模式：如果已報聽且啟用自動模式，檢查是否自摸
      if (me.declaredListen && me.autoMode && isWinningNow(me.hand, me.melds, t)) {
        // 自動胡牌
        setTimeout(() => {
          doWin(0, -1, t, true);
        }, 500);
        return;
      }
      
      if (isWinningNow(me.hand, me.melds, t)) {
        const btnHu = document.getElementById('btnHu');
        btnHu.disabled = false;
        btnHu.classList.add('active');
        log('✨ 你可以自摸（按「胡牌」）或繼續出牌');
      }
      
      // 自動模式：如果已報聽且啟用自動模式，先檢查是否可以加槓
      if (me.declaredListen && me.autoMode && me.tingLocked) {
        // 先檢查是否可以加槓
        const addedKongs = canAddedKong(0);
        if (addedKongs.length > 0) {
          // 可以加槓，亮起加槓按鈕，讓玩家選擇
          document.getElementById('btnKong').classList.add('active');
          document.getElementById('btnKong').disabled = false;
          log('✨ 你可以加槓（按「槓」按鈕）或繼續出牌');
          return; // 不自動出牌，等待玩家選擇
        }
        
        // 沒有加槓選項，自動打剛摸的牌（優先使用drawnTile，否則打最後一張）
        setTimeout(() => {
          if (me.hand.length > 0) {
            let tileToDiscard = null;
            if (me.drawnTile && me.hand.includes(me.drawnTile)) {
              tileToDiscard = me.drawnTile;
            } else {
              const lastIdx = me.hand.length - 1;
              tileToDiscard = me.hand[lastIdx];
            }
            if (tileToDiscard) {
              discard(0, tileToDiscard);
            }
          }
        }, 500);
      }
      
      renderAll();
      // 檢查是否可報聽
      if (!me.declaredListen) {
        const canListenNow = me.hand.some(tile => {
          const testHand = me.hand.filter(tt => tt !== tile);
          return isListening(testHand, me.melds);
        });
        // 不在摸牌階段自動彈出報聽面板
      }
    } else {
      // 無需摸牌，直接出牌；若剛補牌或摸牌，仍檢查是否自摸
      if (me.hand.length > 0) {
        const last = me.hand[me.hand.length - 1];
        
        // 自動模式：如果已報聽且啟用自動模式，檢查是否自摸
        if (me.declaredListen && me.autoMode && isWinningNow(me.hand, me.melds, last)) {
          // 自動胡牌
          setTimeout(() => {
            doWin(0, -1, last, true);
          }, 500);
          return;
        }
        
        if (isWinningNow(me.hand, me.melds, last)) {
          const btnHu = document.getElementById('btnHu');
          btnHu.disabled = false;
          btnHu.classList.add('active');
          log('✨ 你可以自摸（按「胡牌」）或繼續出牌');
        }
      }
      
      // 自動模式：如果已報聽且啟用自動模式，先檢查是否可以加槓
      if (me.declaredListen && me.autoMode && me.tingLocked && me.hand.length > 0) {
        // 先檢查是否可以加槓
        const addedKongs = canAddedKong(0);
        if (addedKongs.length > 0) {
          // 可以加槓，亮起加槓按鈕，讓玩家選擇
          document.getElementById('btnKong').classList.add('active');
          document.getElementById('btnKong').disabled = false;
          log('✨ 你可以加槓（按「槓」按鈕）或繼續出牌');
        } else {
          // 沒有加槓選項，自動打剛摸的牌（優先使用drawnTile，否則打最後一張）
          setTimeout(() => {
            let tileToDiscard = null;
            if (me.drawnTile && me.hand.includes(me.drawnTile)) {
              tileToDiscard = me.drawnTile;
            } else {
              const lastIdx = me.hand.length - 1;
              tileToDiscard = me.hand[lastIdx];
            }
            if (tileToDiscard) {
              discard(0, tileToDiscard);
            }
          }, 500);
        }
      } else {
        log('👉 請選擇要打出的牌');
      }
      
      renderAll();
      if (!me.declaredListen) {
        const canListenNow = me.hand.some(tile => {
          const testHand = me.hand.filter(tt => tt !== tile);
          return isListening(testHand, me.melds);
        });
        // 不在出牌提示階段自動彈出報聽面板
      }
    }
    // 若牌數異常，仍記錄警告，但不影響摸牌邏輯
    if (totalTiles < expectedEmpty || totalTiles > expectedFull) {
      log(`⚠️ 玩家異常：總牌數=${totalTiles}，手牌=${me.hand.length}，副露=${me.melds.length}組，槓數=${kongCount}`);
    }
  } else {
    setTimeout(stepAI, 400 + Math.random() * 400);  // 0.4-0.8秒快速出牌
  }
}

function stepAI() {
  if (S.phase === 'end') return;
  const p = S.turn;
  const me = S.players[p];
  // 依總牌數決定是否需要摸牌
  const kongCount = countKongs(me);
  const totalTiles = me.hand.length + me.melds.reduce((sum, m) => sum + m.tiles.length, 0);
  const expectedFull = 17 + kongCount;
  const expectedEmpty = 16 + kongCount;
  if (totalTiles <= expectedEmpty) {
    drawTile(p);
    if (S.phase === 'end') return;
  }
  renderAll();
  // 檢查自摸（摸牌或補牌後）：優先於槓牌行為
  const lastTile = me.hand[me.hand.length - 1];
  if (isWinningNow(me.hand, me.melds, lastTile)) {
    doWin(p, -1, lastTile, true);
    return;
  }
  // 若牌數異常，紀錄警告（但不影響摸牌邏輯）
  if (totalTiles < expectedEmpty || totalTiles > expectedFull) {
    log(`⚠️ AI 異常：總牌數=${totalTiles}，手牌=${me.hand.length}，副露=${me.melds.length}組，槓數=${kongCount}`);
  }

  // AI 檢查加槓
  const aks = canAddedKong(p);
  if (aks.length > 0) {
    // 檢查搶槓
    const cand = aks[0];
    const key = cand.key;
    const tile = me.hand.find(t => tileKey(t) === key);
    for (let pid = 0; pid < 4; pid++) {
      if (pid !== p && canWinOn(pid, tile)) {
        S.robKong = true;
        doWin(pid, p, tile, false);
        return;
      }
    }
    doAddedKong(p, cand.meldIndex);
    return;
  }
  // AI 檢查暗槓
  const cks = canConcealedKong(p);
  if (cks.length > 0) {
    doConcealedKong(p, cks[0]);
    return;
  }
  // 檢查自摸（再次檢查，理論上在加槓與暗槓處理後）
  if (isWinningNow(me.hand, me.melds, lastTile)) {
    doWin(p, -1, lastTile, true);
    return;
  }
  // AI 聽牌判斷：智能選擇是否報聽
  if (!me.declaredListen) {
    const total = me.hand.length + me.melds.reduce((s, m) => s + m.tiles.length, 0);
    const kongCount = countKongs(me);
    const expectedFull = 17 + kongCount;
    let canListen = false;
    
    if (total === expectedFull) {
      // 檢查是否可聽牌
      canListen = me.hand.some(t => {
        const after = me.hand.filter(x => x !== t);
        return isListening(after, me.melds);
      });
      
      // AI 智能判斷：如果可聽牌，且有 70% 機率報聽
      if (canListen && Math.random() > 0.3) {
        me.declaredListen = true;
        me.tingLocked = false;
        log(`🔔 ${playerName(p)} 報聽了！`);
        renderAll();
      }
    }
  }
  
  // AI報聽後的出牌限制
  const aiPlayer = S.players[p];
  let out;
  
  if (aiPlayer.declaredListen && !aiPlayer.tingLocked) {
    // AI報聽但尚未鎖定，只能丟會形成聽牌的牌
    const validTiles = aiPlayer.hand.filter(t => {
      const after = aiPlayer.hand.filter(x => x !== t);
      return isListening(after, aiPlayer.melds);
    });
    if (validTiles.length > 0) {
      out = validTiles[0];  // 選擇第一張可以聽的牌
    } else {
      out = aiPlayer.hand[0];  // 如果沒有，丟第一張（不應發生）
    }
  } else if (aiPlayer.declaredListen && aiPlayer.tingLocked) {
    // AI報聽且已鎖定，只能丟剛摸的牌
    const lastIdx = aiPlayer.hand.length - 1;
    out = aiPlayer.hand[lastIdx];
  } else {
    // 一般出牌
    out = aiChooseDiscard(p);
  }
  
  setTimeout(() => {
    discard(p, out);
    // AI報聽後丟牌，鎖定聽牌
    if (aiPlayer.declaredListen && !aiPlayer.tingLocked) {
      aiPlayer.tingLocked = true;
      log(`🔒 ${playerName(p)} 聽牌已鎖定`);
    }
  }, 1000 + Math.random() * 1000);  // 1-2秒隨機延遲
}

document.getElementById('btnListen').onclick = () => {
  const me = S.players[0];
  // 如果已報聽，不應該能點擊（按鈕應該是禁用的）
  if (me.declaredListen) {
    return;
  }
  // 檢查是否可聽牌：依據目前手牌張數選擇不同檢查方式
  const total = me.hand.length + me.melds.reduce((s, m) => s + m.tiles.length, 0);
  const kongCount = countKongs(me);
  const expectedFull = 17 + kongCount;
  const expectedEmpty = 16 + kongCount;
  let canListen = false;
  if (total === expectedFull) {
    // 擁有完整張數：打出其中一張後是否聽牌
    canListen = me.hand.some(tile => {
      const testHand = me.hand.filter(t => t !== tile);
      return isListening(testHand, me.melds);
    });
  } else if (total === expectedEmpty) {
    // 少一張的狀態：當前手牌是否已經聽牌
    canListen = isListening(me.hand, me.melds);
  } else {
    // 其他張數不允許報聽
    canListen = false;
  }
  if (!canListen) {
    log('⚠️ 你還沒有聽牌，無法報聽');
    return;
  }
  // 直接設定聽牌狀態，不顯示提示欄
  me.declaredListen = true;
  me.tingLocked = false;  // 尚未鎖定，需要丟一張牌後才鎖定
  me.autoMode = false;  // 先不啟用自動模式，等丟完牌後再啟用
  updateTianDiTing(0);
  const waits = calcWaitingTiles(me.hand, me.melds);
  me.waitKeys = waits.slice();
  const waitText = waits.map(k => keyToText(k)).join(' ');
  log('🔔 你報聽了！請選擇要丟的牌，丟完牌後將啟用自動模式');
  log('👂 等牌：' + waitText);
  
  // 不自動丟牌，讓玩家自己選擇要丟哪張牌
  // 丟完牌後會在 onClickYourTile 中鎖定聽牌並啟用自動模式
  renderAll();
};

// 玩家執行暗槓（手牌四張相同）或反應面板的槓
document.getElementById('btnKong').onclick = () => {
  // 優先處理反應面板的槓（當其他玩家打出牌時可以槓）
  if (S.currentReactions) {
    const kongReact = S.currentReactions.find(r => r.type === 'kong');
    if (kongReact) {
      handleKongClick();
      return;
    }
  }
  
  // 處理玩家自己的暗槓和加槓
  if (S.turn !== 0 || S.phase === 'end' || S.lastDiscard !== null) return;
  const me = S.players[0];
  // 聽牌後仍可以暗槓和加槓
  const added = canAddedKong(0);
  const concealed = canConcealedKong(0);
  // 優先處理加槓
  if (added.length > 0) {
    const cand = added[0];
    const key = cand.key;
    // 找出手牌中的第四張
    const tile = me.hand.find(t => tileKey(t) === key);
    // 檢查是否有玩家可以搶槓
    for (let pid = 1; pid < 4; pid++) {
      if (canWinOn(pid, tile)) {
        // 搶槓胡牌
        S.robKong = true;
        doWin(pid, 0, tile, false);
        return;
      }
    }
    // 無人搶槓，執行加槓
    doAddedKong(0, cand.meldIndex);
    return;
  }
  // 若沒有加槓則檢查暗槓
  if (concealed.length > 0) {
    const key = concealed[0];
    doConcealedKong(0, key);
    return;
  }
};

  clearAutoSave();
  startNewHand(true);
};

// ========= IndexedDB 存檔/讀檔功能 =========
const DB_NAME = 'MahjongGameDB';
const DB_VERSION = 1;
const STORE_NAME = 'gameSaves';
const AUTO_SAVE_KEY = 'autoSave';
const MANUAL_SAVE_KEY = 'manualSave';

// 初始化 IndexedDB
function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    
    request.onerror = () => reject(request.error);
    request.onsuccess = () => resolve(request.result);
    
    request.onupgradeneeded = (event) => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
  });
}

// 自動暫存遊戲狀態
async function autoSaveGame() {
  try {
    if (!S || S.phase === 'end') return;
    
    const db = await initDB();
    const transaction = db.transaction([STORE_NAME], 'readwrite');
    const store = transaction.objectStore(STORE_NAME);
    
    const gameData = {
      gameState: clone(S),
      rules: clone(RULES),
      seatNames: seatNames ? seatNames.slice() : null,
      randomNames: randomNames ? randomNames.slice() : null,
      customPlayerName: customPlayerName,
      dealerStreak: dealerStreak,
      timestamp: new Date().toISOString()
    };
    
    await new Promise((resolve, reject) => {
      const request = store.put(gameData, AUTO_SAVE_KEY);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
    
    console.log('💾 遊戲已自動暫存');
  } catch (error) {
    console.error('自動暫存失敗:', error);
  }
}

// 清除自動暫存
async function clearAutoSave() {
  try {
    const db = await initDB();
    const transaction = db.transaction([STORE_NAME], 'readwrite');
    const store = transaction.objectStore(STORE_NAME);
    await new Promise((resolve, reject) => {
      const request = store.delete(AUTO_SAVE_KEY);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  } catch (error) {
    console.error('清除自動暫存失敗:', error);
  }
}

// 讀取自動暫存
async function loadAutoSave() {
  try {
    const db = await initDB();
    const transaction = db.transaction([STORE_NAME], 'readonly');
    const store = transaction.objectStore(STORE_NAME);
    
    return await new Promise((resolve, reject) => {
      const request = store.get(AUTO_SAVE_KEY);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  } catch (error) {
    console.error('讀取自動暫存失敗:', error);
    return null;
  }
}

// 手動存檔
async function saveGame() {
  try {
    if (!S || S.phase === 'end') {
      log('⚠️ 遊戲尚未開始或已結束，無法存檔');
      return;

    const gameData = {

      dealerStreak: dealerStreak,

    };
    
    await new Promise((resolve, reject) => {
      const request = store.put(gameData, MANUAL_SAVE_KEY);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
    
    log('💾 遊戲已存檔');
  } catch (error) {

// 手動讀檔
async function loadGame() {
  try {
    const db = await initDB();
    const transaction = db.transaction([STORE_NAME], 'readonly');
    const store = transaction.objectStore(STORE_NAME);
    
    const gameData = await new Promise((resolve, reject) => {
      const request = store.get(MANUAL_SAVE_KEY);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    
    if (!gameData) {
      log('⚠️ 沒有找到存檔');
      return false;
    }
    
    // 恢復遊戲狀態
    S = gameData.gameState;
    RULES.points.base = gameData.rules.points.base;
    RULES.points.perFan = gameData.rules.points.perFan;
    RULES.initialPoints = gameData.rules.initialPoints;
    seatNames = gameData.seatNames;
    randomNames = gameData.randomNames;
    customPlayerName = gameData.customPlayerName;
    dealerStreak = gameData.dealerStreak || 0;
    
    // 更新顯示
    updateSettingsDisplay();
    renderAll();
    
    const saveTime = new Date(gameData.timestamp).toLocaleString('zh-TW');
    log(`📂 遊戲已讀檔（存檔時間：${saveTime}）`);
    return true;
  } catch (error) {
    console.error('讀檔失敗:', error);
    log('❌ 讀檔失敗：' + error.message);
    return false;
  }
}

function onClickYourTile(idx) {
  if (S.turn !== 0 || S.phase === 'end') return;
  const me = S.players[0];
  // 新增：當有反應面板時，不允許丟牌
  if (S.waitReact !== null) {
    log('⚠️ 請先選擇吃、碰、槓或過');
    return;
  }
  
  // 新增：報聽後且尚未鎖定，只能丟會形成聽牌的手牌
  if (me.declaredListen && !me.tingLocked) {
    const tile = me.hand[idx];
    const afterDiscard = me.hand.filter(t => t !== tile);
    if (!isListening(afterDiscard, me.melds)) {
      log('⚠️ 報聽後只能丟會形成聽牌的手牌');
      return;
    }
  }
  // 新規則：如果已報聽且已鎖定，只能打剛摸的那張牌（drawnTile）
  if (me.declaredListen && me.tingLocked) {
    // 如果記錄有剛摸的牌，則限制只能打該牌
    if (me.drawnTile) {
      const selected = me.hand[idx];
      if (selected !== me.drawnTile) {
        log('⚠️ 已鎖定聽牌，只能打剛摸的牌');
        return;
      }
    } else {
      // 若不存在 drawnTile（可能在補牌或其他狀態），則使用原有判定：必須處於摸牌狀態才可打
      const kongCount = countKongs(me);
      const expectedFull = 17 + kongCount;
      const totalTiles = me.hand.length + me.melds.reduce((sum, m) => sum + m.tiles.length, 0);
      const hasDrawn = (totalTiles === expectedFull);
      if (hasDrawn) {
        const lastIdx = me.hand.length - 1;
        if (idx !== lastIdx) {
          log('⚠️ 已鎖定聽牌，只能打剛摸的牌');
          return;
        }
      }
    }
  }
  const tile = me.hand[idx];
  discard(0, tile);
  // 新規則：如果已報聽但尚未鎖定，丟牌後立即鎖定並啟用自動模式
  if (me.declaredListen && !me.tingLocked) {
    me.tingLocked = true;
    me.autoMode = true;  // 丟完牌後才啟用自動模式
    log('🔒 聽牌已鎖定，已啟用自動模式（自動出牌和自動胡牌）');
    log('🔒 聽牌已鎖定，之後只能打摸到的牌');
  }
}

/* ========= UI 渲染 ========= */
function renderAll() {
  // 每次重繪前，為所有玩家檢查聽牌狀態並即時計算等待牌。
  // 聽牌條件：當前總牌數為應該丟牌（17+槓數）或摸牌（16+槓數）時，檢查是否只差一張牌就能胡。
  for (let i = 0; i < 4; i++) {
    const p = S.players[i];
    const kc = countKongs(p);
    const totalP = p.hand.length + p.melds.reduce((sum, m) => sum + m.tiles.length, 0);
    const expFull = 17 + kc;
    const expEmpty = 16 + kc;
    let ting = false;
    if (totalP === expFull) {
      // 有摸牌時：測試打出手中任一張後是否能胡
      ting = p.hand.some(t => {
        const test = p.hand.filter(x => x !== t);
        return isListening(test, p.melds);
      });
    } else if (totalP === expEmpty) {
      // 少一張時：直接檢查是否聽牌
      ting = isListening(p.hand, p.melds);
    }
    if (ting) {
      p.waitKeys = calcWaitingTiles(p.hand, p.melds);
    } else {
      p.waitKeys = [];
    }
  }
  
  const sc = document.getElementById('scoreboard');
  // Compose each player's information: name, points, listen state, dealer badge, and dealer streak indicator
  const diceSymbols = ['\u2680', '\u2681', '\u2682', '\u2683', '\u2684', '\u2685'];
  sc.innerHTML = '<div class="score">' + [0, 1, 2, 3].map(i => {
    const n = playerName(i);
    const p = S.players[i];
    const cls = (i === S.dealer ? 'dealer' : '');
    const bankrupt = p.points <= 0 ? '<span class="danger">（破產）</span>' : '';
    // Listen badge: priority is 天聽, then 地聽, then ordinary 聽
    let listenBadge = '';
    if (p.tianTing) {
      listenBadge = '<span class="badge ok">天聽</span>';
    } else if (p.diTing) {
      listenBadge = '<span class="badge ok">地聽</span>';
    } else if (p.declaredListen) {
      listenBadge = '<span class="badge ok">聽</span>';
    }
    // Dealer streak dice: if this player is the current dealer and has a streak, show the appropriate dice icon
    let diceBadge = '';
    if (i === S.dealer && S.dealerStreak && S.dealerStreak > 0) {
      const idx = Math.min(S.dealerStreak, diceSymbols.length) - 1;
      diceBadge = `<span class="dice">${diceSymbols[idx]}</span>`;
    }
    // Dealer badge: display a special label when this player is the dealer
    let dealerBadge = '';
    if (i === S.dealer) {
      dealerBadge = '<span class="dealer-badge">莊</span>';
    }
    return `<div class="player-info ${cls}">
      <div class="player-name">${n}${dealerBadge} ${diceBadge} ${bankrupt} ${listenBadge}</div>
      <div class="player-points">${p.points.toLocaleString()}</div>
    </div>`;
  }).join('') + '</div>';
  
  // 計算剩餘可摸牌數：牌山 - 海底16張
  const remainDrawable = Math.max(0, S.wall.length);
  
  // Compose current round string: e.g. 東風東、東風南、南風西等
  const roundStr = ['東','南','西','北'][S.round - 1] + '風' + (seatNames?.[S.dealer] || ['東','南','西','北'][S.dealer]);
  // 更新局面資訊區：將當前風圈以更醒目的膠囊顯示

    `<span class="pill">🎴 剩餘牌：${remainDrawable}</span>` +
    `<span class="pill">👤 輪到：${playerName(S.turn)}</span>`;
  
  // 更新中央資訊面板
  const centerRoundInfo = document.getElementById('centerRoundInfo');
  const centerWindIndicators = document.getElementById('centerWindIndicators');
  const centerRemain = document.getElementById('centerRemain');

    const dealerWind = seatNames?.[S.dealer] || ['東', '南', '西', '北'][S.dealer];

  if (centerWindIndicators) {

    const roundWind = ['東', '南', '西', '北'][S.round - 1];
    centerWindIndicators.innerHTML = winds.map(w => {

      return `<span class="wind-indicator ${isActive ? 'active' : ''}">${w}</span>`;
    }).join('');
  }
  
  // 更新剩餘牌數
  if (centerRemain) {
    const remainPercent = Math.round((remainDrawable / 144) * 100);
    centerRemain.innerHTML = `🀄 剩餘 <strong>${remainDrawable}</strong> 張 (${remainPercent}%)`;
  }
  
  const you = S.players[0];
  const kongCount = countKongs(you);
  const expectedFull = 17 + kongCount;
  const hasDrawn = (you.hand.length === expectedFull);
  // 構建帶原始索引的陣列
  const origTiles = you.hand.map((t, idx) => ({ tile: t, index: idx }));
  let displayRest = [];
  let drawnObj = null;
  if (hasDrawn) {
    // 把最後一張視為剛摸的牌，不與其他牌一起排序
    drawnObj = origTiles[origTiles.length - 1];
    const rest = origTiles.slice(0, -1);
    displayRest = rest.sort((a, b) => tileSortKey(a.tile) - tileSortKey(b.tile));
  } else {
    // 沒有摸牌狀態，將所有牌排序
    displayRest = origTiles.slice().sort((a, b) => tileSortKey(a.tile) - tileSortKey(b.tile));
  }
  // 單行顯示全部手牌，不分上下排
  let handHTML = '<div class="hand-container"><div class="hand-row">';
  displayRest.forEach(item => {
    const t = item.tile;
    const idx = item.index;
    const k = tileKey(t);
    const suitClass = `suit-${t.suit}`;
    handHTML += `<div class="tile ${suitClass}" onclick="onClickYourTile(${idx})">${keyToText(k)}</div>`;
  });
  // 若有摸牌狀態，加入空格與摸到的牌
  if (hasDrawn && drawnObj) {
    handHTML += `<div class="tile placeholder"></div>`;
    const t = drawnObj.tile;
    const idx = drawnObj.index;
    const k = tileKey(t);
    const suitClass = `suit-${t.suit}`;
    handHTML += `<div class="tile tile-drawn ${suitClass}" onclick="onClickYourTile(${idx})">${keyToText(k)}</div>`;
  }
  handHTML += '</div></div>';
  document.getElementById('yourHand').innerHTML = handHTML;
  
  let meldsHTML = '';
  if (you.melds.length > 0) {
    meldsHTML = you.melds.map(m => {
      // 定義標籤和標籤類別
      let label = '';
      let labelClass = '';
      if (m.type === 'pong') {
        label = '碰';
        labelClass = 'pong';
      } else if (m.type === 'kong') {
        label = m.concealed ? '暗槓' : '槓';
        labelClass = m.concealed ? 'concealed-kong' : 'kong';
      } else if (m.type === 'chow') {
        label = '吃';
        labelClass = 'chow';
      }
      // 調整吃牌順序：將被吃的牌放置中間
      let tilesForDisp;
      if (m.type === 'chow' && typeof m.centerIdx === 'number') {
        const arr = m.tiles.slice();
        // 從複本陣列中抽出中心牌
        const center = arr.splice(m.centerIdx, 1)[0];
        const lower = arr[0];
        const higher = arr[1];
        tilesForDisp = [lower, center, higher];
      } else {
        tilesForDisp = m.tiles;
      }
      const tilesHTML = tilesForDisp.map(t => {
        const k = tileKey(t);
        const suitClass = `suit-${t.suit}`;
        return `<div class="tile small ${suitClass}">${keyToText(k)}</div>`;
      }).join('');
      return `<div class="meld-group"><div style="display: flex; gap: 2px;">${tilesHTML}</div></div>`;
    }).join('');
  }
  // 更新你的副露區
  const yourMeldsEl = document.getElementById('yourMelds');
  if (yourMeldsEl) yourMeldsEl.innerHTML = meldsHTML;
  
  // Reset the self-draw button state. It will be enabled below if the player
  // just drew a winning tile.
  const btnHu = document.getElementById('btnHu');
  // 只有在沒有反應選項時才重置按鈕（自摸時不應該有反應選項）
  if (!S.currentReactions && !S.waitReact) {

    btnHu.classList.remove('active');

    if (S.turn === 0 && S.phase !== 'end') {
      const mePlayer = S.players[0];
      // 檢查手牌中是否有能自摸的牌（檢查最後一張牌，通常是剛摸的牌）
      if (mePlayer.hand.length > 0) {
        const lastTile = mePlayer.hand[mePlayer.hand.length - 1];
        if (isWinningNow(mePlayer.hand, mePlayer.melds, lastTile)) {
          btnHu.disabled = false;
          btnHu.classList.add('active');
        }
      }
    }
  }
  
  // 聽牌按鈕：報聽後按鈕變灰，不能再按
  const me = S.players[0];
  let canListenBtn = false;
  // 如果已報聽，按鈕禁用

    canListenBtn = false;
  } else if (S.turn === 0 && S.phase !== 'end') {

    const totalTilesMe = me.hand.length + me.melds.reduce((sum, m) => sum + m.tiles.length, 0);
    const expectedFull = 17 + kongCount;
    const expectedEmpty = 16 + kongCount;
    // 出牌狀態：expectedFull，檢查打出任一牌後是否聽牌
    if (totalTilesMe === expectedFull) {
      const canListenAfterDiscard = me.hand.some(tile => {
        const testHand = me.hand.filter(t => t !== tile);
        return isListening(testHand, me.melds);
      });
      if (canListenAfterDiscard) canListenBtn = true;
    }
    // 摸牌後待摸狀態：expectedEmpty，檢查手牌是否已經聽牌
    if (totalTilesMe === expectedEmpty) {
      canListenBtn = isListening(me.hand, me.melds);
    }
  }
  document.getElementById('btnListen').disabled = !canListenBtn;

  // 暗槓按鈕：輪到玩家，無棄牌反應，且手牌中存在四張相同牌時啟用
  // 聽牌後仍可以暗槓和加槓（不會改變手牌結構）
